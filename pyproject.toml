[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packer-build-action"
version = "1.0.0"
description = "GitHub Action for building OpenStack images with Packer via bastion hosts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "The Linux Foundation", email = "releng@linuxfoundation.org"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
minversion = "9.0.3"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Note: Code coverage is disabled for this action as it primarily
# consists of shell scripts and YAML configurations.
# Tests validate action configurations, workflows, and script syntax.

[tool.basedpyright]
# Lowest supported version, per requires-python
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
# Same directories the pre-commit hook passes, so editor and bare runs match
include = ["scripts", "tests"]

# Pin the ruff rule set explicitly.
#
# Without a `select`, ruff applies its *default* rule set, and that
# default is not stable across releases:
#
#     ruff 0.15.22 ->  59 rules across  2 categories (E, F)
#     ruff 0.16.0  -> 413 rules across 38 categories
#
# A routine `pre-commit autoupdate` crossing that boundary changed which
# rules run and broke repositories across this organisation, on code
# nobody had touched.  Here it surfaced six PLW1510 findings in the test
# suite, all on code that had not been modified.
#
# The selection below is the de facto standard across this organisation,
# present as a superset in 13 of the 16 repositories that already pin
# their rules.  This repository is already clean under it, so pinning
# changes no behaviour today: both ruff 0.15.22 and 0.16.0 report all
# checks passing.
#
# Rules outside the selection are disabled for now; that is the point.
# This is not a permanent exclusion, and it is not a judgement that those
# rules lack merit.  It makes adopting any of them a deliberate, reviewed
# opt-in rather than something that arrives unannounced with a version
# bump.
#
# Note that this pins the rule set at CATEGORY level, not rule level.
# Ruff selectors are prefixes, so a future release adding new E* or F*
# rules would enable them here automatically.  The aim is to bound the
# blast radius, not to freeze the set outright.
#
# `line-length` and `target-version` are intentionally left unset so
# ruff's own defaults continue to apply unchanged.

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

ignore = [
    "E501", # line-too-long: the formatter owns line length
]

[tool.ruff.lint.per-file-ignores]
# Test suites legitimately break rules that matter in library code.
#
# None of these codes is reachable under the current `select`.  They are
# listed anyway so that a later widening, to "S", "ARG" or "PL", does not
# immediately flag every test module.  PLR0917 is the concrete case
# already seen elsewhere in this organisation: tests stacking @patch
# decorators cannot satisfy it, because unittest.mock injects its mocks
# positionally, so a keyword-only signature is impossible rather than
# merely inconvenient.
"tests/**/*.py" = ["S101", "ARG", "PLR0913", "PLR0917", "PLR2004"]
