name: Test Packer Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-validate:
    name: Test Validation Mode
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout packer-build-action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: action-repo

      - name: Checkout test repository with Packer templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lfit/releng-common-packer
          path: target-repo
          submodules: recursive

      - name: Run Packer validation
        uses: ./action-repo
        with:
          mode: validate
          packer_working_dir: "."
          path_prefix: "target-repo"
          packer_version: "1.11.2"
          python_version: "3.11"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test Results"
            echo "✅ Validation test completed"
          } >> "${GITHUB_STEP_SUMMARY}"

  test-template-discovery:
    name: Test Template Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden the runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout packer-build-action
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Focused regression cover for template discovery, run against
      # the real script and the real action metadata with a stub
      # packer. Complements the end-to-end job above, which can only
      # exercise whatever layout the external test repository has.
      - name: Run template discovery regression tests
        shell: bash
        run: |
          # Run template discovery regression tests
          # PyYAML lets the test read the init fallback out of the
          # action metadata rather than keeping a copy of it.
          python3 -m pip install --disable-pip-version-check -q pyyaml
          bash tests/test-template-discovery.sh
