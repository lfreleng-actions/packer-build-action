---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: Test Packer Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-validate:
    name: ${{ matrix.hide-jq && 'Test Validation Mode (without jq)' || 'Test Validation Mode' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hide-jq: [false, true]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout test repository with Packer templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: lfit/releng-common-packer
          path: target-repo
          submodules: recursive

      - name: Prepare missing jq and HTTP apt sources
        if: matrix.hide-jq
        shell: bash
        run: |
          sudo mv /usr/bin/jq "$RUNNER_TEMP/packer-build-jq"
          # APT still sees jq as installed after the binary is moved.
          echo 'APT::Get::ReInstall "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-packer-build-jq-reinstall > /dev/null
          # Hosted Ubuntu can keep its mirror URLs outside ubuntu.sources.
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          mirror_list=/etc/apt/apt-mirrors.txt
          if grep -Eq '^URIs:.*[[:blank:]]mirror\+file:/etc/apt/apt-mirrors\.txt([[:blank:]]|$)' \
            "$ubuntu_sources"; then
            sudo sed -i 's|^https://|http://|' "$mirror_list"
            grep -q '^http://' "$mirror_list"
          else
            sudo sed -i '/^URIs:/s|https://|http://|g' "$ubuntu_sources"
            grep -Eq '^URIs:.*http://' "$ubuntu_sources"
          fi
          if command -v jq; then
            echo "::error::Another jq binary is on PATH"
            exit 1
          fi

      - name: Run Packer validation
        uses: $/
        with:
          mode: validate
          packer_working_dir: "."
          path_prefix: "target-repo"
          packer_version: "1.11.2"
          python_version: "3.11"
          apt_http_fallback_override: ${{ vars.APT_HTTP_FALLBACK }}

      - name: Verify jq installation and HTTPS sources
        if: matrix.hide-jq
        shell: bash
        run: |
          /usr/bin/jq --version
          shopt -s nullglob
          sources=(/etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources)
          for source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt; do
            if [[ -f "$source" ]]; then
              sources+=("$source")
            fi
          done
          test "${#sources[@]}" -gt 0
          if grep -Eq '^[^#]*http://' "${sources[@]}"; then
            echo "::error::APT sources still contain HTTP URLs"
            exit 1
          else
            test "$?" -eq 1
          fi

      - name: Restore jq
        if: always() && matrix.hide-jq
        run: |
          sudo rm -f /etc/apt/apt.conf.d/99-packer-build-jq-reinstall
          if [[ -f "$RUNNER_TEMP/packer-build-jq" ]]; then
            sudo mv "$RUNNER_TEMP/packer-build-jq" /usr/bin/jq
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test Results"
            echo "✅ Validation test completed"
          } >> "${GITHUB_STEP_SUMMARY}"

  test-template-discovery:
    name: Test Template Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden the runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout packer-build-action
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Focused regression cover for template discovery, run against
      # the real script and the real action metadata with a stub
      # packer. Complements the end-to-end job above, which can only
      # exercise whatever layout the external test repository has.
      - name: Run template discovery regression tests
        shell: bash
        run: |
          # Run template discovery regression tests
          # PyYAML lets the test read the init fallback out of the
          # action metadata rather than keeping a copy of it.
          python3 -m pip install --disable-pip-version-check -q pyyaml
          bash tests/test-template-discovery.sh
