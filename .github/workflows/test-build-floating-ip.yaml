name: Test Packer Build with Floating IP (No Bastion)

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "action.yaml"
      - "examples/**"
      - ".github/workflows/test-build-floating-ip.yaml"
  # Deliberately pull_request (not pull_request_target): the job checks out
  # and runs the code under test, so it must stay unprivileged. Fork PRs
  # and Dependabot receive no secrets and cannot reach the OpenStack
  # tenant, so the job skips on them. To exercise fork code, push its head
  # to a branch in this repository and raise a pull request from there.
  pull_request:
    branches:
      - main
    paths:
      - "action.yaml"
      - "examples/**"
      - ".github/workflows/test-build-floating-ip.yaml"
  workflow_dispatch:
    inputs:
      template:
        description: "Packer template to build"
        required: true
        default: "templates/builder.pkr.hcl"
      vars_file:
        description: "Packer vars file"
        required: true
        default: "vars/ubuntu-22.04.pkrvars.hcl"

permissions:
  contents: read

concurrency:
  # Use a per-PR key for pull_request runs (github.ref is the merge ref
  # under that event); fall back to github.ref for push and
  # workflow_dispatch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-test-floating-ip:
    name: Integration Test - Build with Floating IP
    # Runs on push, workflow_dispatch and same-repository pull requests.
    # Fork PRs and Dependabot receive no secrets, so skip rather than fail
    # part-way through provisioning.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Scopes the OpenStack and Tailscale secrets to a dedicated
    # environment. No reviewers are configured: the trigger is
    # pull_request, so fork PRs never receive secrets and need no gate.
    environment: integration-auto
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout test repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lfit/releng-common-packer
          ref: master
          path: target-repo
          submodules: recursive
          persist-credentials: false

      - name: Build with Packer (Floating IP mode)
        id: build
        uses: $/
        with:
          mode: build
          # NO bastion_ip - this forces use_floating_ip=true
          packer_template: ${{ github.event.inputs.template || 'templates/builder.pkr.hcl' }}
          packer_vars_file: ${{ github.event.inputs.vars_file || 'vars/ubuntu-22.04.pkrvars.hcl' }}
          packer_working_dir: "."
          path_prefix: "target-repo"
          os_cloud: "openstack"
          openstack_auth_url: ${{ secrets.OPENSTACK_AUTH_URL }}
          openstack_project_id: ${{ secrets.OPENSTACK_PROJECT_ID }}
          openstack_username: ${{ secrets.OPENSTACK_USERNAME }}
          openstack_password: ${{ secrets.OPENSTACK_PASSWORD_B64 }}
          openstack_network_id: ${{ secrets.OPENSTACK_NETWORK_ID }}
          openstack_domain_name: ${{ secrets.OPENSTACK_DOMAIN_NAME }}
          packer_version: "1.11.2"
          python_version: "3.11"
          ansible_version: "9.2.0"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test Results - Floating IP Mode"
            echo ""
            echo "This test uses **floating IP** instead of bastion for SSH access."
            echo "The instance gets a public IP address and GitHub runner connects directly."
            echo ""
            echo "**Build Status:** ${STEPS_BUILD_OUTPUTS_BUILD_STATUS}"
            if [[ -n "${STEPS_BUILD_OUTPUTS_IMAGE_NAME}" ]]; then
              echo "**Image Name:** ${STEPS_BUILD_OUTPUTS_IMAGE_NAME}"
            fi
            echo ""
            if [[ "${STEPS_BUILD_OUTPUTS_BUILD_STATUS}" == "success" ]]; then
              echo "✅ **Floating IP mode works!**"
              echo ""
              echo "If bastion mode fails but floating IP works, the issue is network routing:"
              echo "- The Tailscale bastion cannot route to OpenStack's private network"
              echo "- Solution: Provision bastion VM inside OpenStack or continue using floating IPs"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          STEPS_BUILD_OUTPUTS_BUILD_STATUS: ${{ steps.build.outputs.build_status }}
          STEPS_BUILD_OUTPUTS_IMAGE_NAME: ${{ steps.build.outputs.image_name }}
