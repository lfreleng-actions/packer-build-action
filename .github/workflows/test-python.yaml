name: Test Python

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "tests/**"
      - "scripts/**"
      - "action.yaml"
      - "pyproject.toml"
      - ".github/workflows/test-python.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "tests/**"
      - "scripts/**"
      - "action.yaml"
      - "pyproject.toml"
      - ".github/workflows/test-python.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test Python code"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # --require-hashes makes pip refuse anything the lock does not
          # cover by digest, so a compromised index cannot substitute a
          # package. The lock is generated from the "test" extra in
          # pyproject.toml, which remains the source of truth.
          python -m pip install --require-hashes -r tests/requirements.txt

      - name: Install Packer
        run: |
          PACKER_VERSION="1.11.2"
          wget -q "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
          unzip -q "packer_${PACKER_VERSION}_linux_amd64.zip"
          sudo mv packer /usr/local/bin/
          packer version

      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=term --cov-report=html

      - name: Generate coverage summary
        if: always()
        run: |
          {
            echo "## Test Coverage Report"
            echo "\`\`\`"
            coverage report
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.11'
        with:
          name: coverage-reports
          path: htmlcov/
