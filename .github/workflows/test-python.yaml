name: Test Python

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "tests/**"
      - "scripts/**"
      - "action.yaml"
      - "pyproject.toml"
      - ".github/workflows/test-python.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "tests/**"
      - "scripts/**"
      - "action.yaml"
      - "pyproject.toml"
      - ".github/workflows/test-python.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test Python code"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # --require-hashes makes pip refuse anything the lock does not
          # cover by digest, so a compromised index cannot substitute a
          # package. The lock is generated from the "test" extra in
          # pyproject.toml, which remains the source of truth.
          python -m pip install --require-hashes -r tests/requirements.txt

      - name: Install Packer
        run: |
          PACKER_VERSION="1.11.2"
          wget -q "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
          unzip -q "packer_${PACKER_VERSION}_linux_amd64.zip"
          sudo mv packer /usr/local/bin/
          packer version

      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=term --cov-report=html

      - name: Generate coverage summary
        if: always()
        run: |
          {
            echo "## Test Coverage Report"
            echo "\`\`\`"
            coverage report
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.11'
        with:
          name: coverage-reports
          path: htmlcov/
