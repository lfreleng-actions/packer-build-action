---
# SPDX-License-Identifier: Apache-2.0
# Test Packer Build with Legacy Auth Key

name: Test Packer Build (Legacy Auth Key)

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      packer_template:
        description: "Packer template to build"
        required: false
        type: string
        default: "builder.pkr.hcl"
      packer_vars:
        description: "Packer vars file"
        required: false
        type: string
        default: "ubuntu-22.04"
      debug_mode:
        description: "Enable debug logging"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - "scripts/**"
      - "action.yaml"
      - ".github/workflows/test-build-authkey.yaml"
  # Deliberately pull_request (not pull_request_target): the jobs check out
  # and run the code under test, so they must stay unprivileged. Fork PRs
  # and Dependabot receive no secrets and cannot reach the OpenStack
  # tenant, so the suite skips on them. To exercise fork code, push its
  # head to a branch in this repository and raise a pull request from
  # there.
  pull_request:
    branches:
      - main
    paths:
      - "examples/**"
      - "scripts/**"
      - "action.yaml"
      - ".github/workflows/test-build-authkey.yaml"

permissions:
  contents: read

concurrency:
  # Use a per-PR key for pull_request runs (github.ref is the merge ref
  # under that event); fall back to github.ref for push and
  # workflow_dispatch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    # Runs on push, workflow_dispatch and same-repository pull requests.
    # Fork PRs and Dependabot receive no secrets, so skip rather than fail
    # part-way through provisioning. This entry job gates the rest of the
    # suite; downstream jobs cannot start until it succeeds.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # dorny/paths-filter lists changed files via the API on pull request
      # events; without this it can fail with HTTP 403.
      pull-requests: read  # Required for dorny/paths-filter to list changed files
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: check
        with:
          # On pull requests the action ignores 'base' and lists changed
          # files through the REST API against the PR base branch, so pass
          # an empty string to avoid a misleading warning. On push, diff
          # against the commit that preceded it.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            has-changes:
              - 'examples/**'
              - 'scripts/**'
              - 'action.yaml'
              - '.github/workflows/**'

  test-packer-build:
    name: "Test Packer build (auth key)"
    needs: prepare
    if: |
      needs.prepare.outputs.has-changes == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Secrets are consumed here; declare a dedicated environment. The
    # 'prepare' job already gates the suite (via needs), so this uses the
    # unprotected 'integration-auto' to avoid a redundant second approval.
    environment: integration-auto
    timeout-minutes: 45

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ========================================
      # Step 1: Setup Bastion with Legacy Auth Key
      # ========================================
      - name: Setup OpenStack Bastion with Tailscale (Auth Key)
        id: bastion
        uses: lfreleng-actions/tailscale-openstack-bastion-action@c60c23164c9490d6031308e618e6c6c98a50509d # v0.1.2
        with:
          operation: setup
          tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
          openstack_auth_url: ${{ secrets.OPENSTACK_AUTH_URL }}
          openstack_project_id: ${{ secrets.OPENSTACK_PROJECT_ID }}
          openstack_username: ${{ secrets.OPENSTACK_USERNAME }}
          openstack_password: ${{ secrets.OPENSTACK_PASSWORD_B64 }}
          openstack_region: ${{ secrets.OPENSTACK_REGION }}
          bastion_name: "packer-authkey-${{ github.run_id }}"
          bastion_flavor: "v3-standard-2"
          bastion_image: "Ubuntu 22.04.5 LTS (x86_64) [2025-03-27]"
          bastion_network: "odlci"
          debug_mode: ${{ inputs.debug_mode || 'false' }}

      # ========================================
      # Step 2: Run Packer Build Action
      # ========================================
      - name: Build Packer Image
        uses: $/
        with:
          mode: build
          packer_version: "1.11.2"
          packer_template: "examples/templates/builder.pkr.hcl"
          packer_vars_file: "examples/vars/ubuntu-22.04.pkrvars.hcl"
          path_prefix: "."
          bastion_ip: ${{ steps.bastion.outputs.bastion_ip }}
          bastion_ssh_user: "root"
          os_cloud: "openstack"
          openstack_auth_url: ${{ secrets.OPENSTACK_AUTH_URL }}
          openstack_project_id: ${{ secrets.OPENSTACK_PROJECT_ID }}
          openstack_username: ${{ secrets.OPENSTACK_USERNAME }}
          openstack_password: ${{ secrets.OPENSTACK_PASSWORD_B64 }}
          openstack_network_id: ${{ secrets.OPENSTACK_NETWORK_ID }}
          openstack_domain_name: ${{ secrets.OPENSTACK_DOMAIN_NAME }}

      # ========================================
      # Step 3: Teardown Bastion
      # ========================================
      - name: Teardown Bastion Host
        if: always()
        uses: lfreleng-actions/tailscale-openstack-bastion-action@c60c23164c9490d6031308e618e6c6c98a50509d # v0.1.2
        with:
          operation: teardown
          bastion_name: "packer-authkey-${{ github.run_id }}"
          openstack_auth_url: ${{ secrets.OPENSTACK_AUTH_URL }}
          openstack_project_id: ${{ secrets.OPENSTACK_PROJECT_ID }}
          openstack_username: ${{ secrets.OPENSTACK_USERNAME }}
          openstack_password: ${{ secrets.OPENSTACK_PASSWORD_B64 }}
          openstack_region: ${{ secrets.OPENSTACK_REGION }}

  summary:
    name: "Summary"
    # Always run (to summarise results) but only where the suite itself is
    # eligible; fork PRs and Dependabot skip the whole workflow.
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [prepare, test-packer-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Build summary
        env:
          WORKFLOW_NAME: "${{ github.workflow }}"
          RUN_ID: "${{ github.run_id }}"
          EVENT_NAME: "${{ github.event_name }}"
          REF_NAME: "${{ github.ref_name }}"
          BUILD_RESULT: "${{ needs.test-packer-build.result }}"
        run: |
          {
            echo "## Packer Build Test Summary - Legacy Auth Key"
            echo ""
            echo "**Authentication Method:** Legacy Tailscale Auth Key (Deprecated)"
            echo ""
            echo "- **Workflow:** $WORKFLOW_NAME"
            echo "- **Run ID:** $RUN_ID"
            echo "- **Trigger:** $EVENT_NAME"
            echo "- **Branch:** $REF_NAME"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BUILD_RESULT" == "success" ]; then
            echo "✅ **Build Status:** Success" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$BUILD_RESULT" == "skipped" ]; then
            echo "⏭️ **Build Status:** Skipped (no relevant changes)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Build Status:** Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
