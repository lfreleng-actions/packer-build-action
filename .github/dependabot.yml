version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(actions)"
    # Wait before opening a bump PR so we don't churn on a release
    # that gets retracted or superseded shortly after it ships. This
    # 7-day cooldown is a supply-chain security best practice: it gives
    # time for a bad release to be yanked before we adopt it.
    cooldown:
      default-days: 7
      # Our own organisation's actions and reusable workflows skip the
      # cooldown: we review those releases ourselves, and their fixes
      # need to reach callers without a week's delay.
      exclude:
        - "lfreleng-actions/*"
    open-pull-requests-limit: 15

  # The hash-pinned locks cannot pick up fixes on their own; Dependabot
  # regenerates them (digests included) as releases appear.
  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/.github/openstack"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(deps)"
    cooldown:
      default-days: 7
